name: Scheduled data refresh

# The market gauges (VIX, credit spreads, yield curve) move daily — a monthly
# rebuild could show "Calm waters" for weeks through a volatility spike. This
# cron pings the Cloudflare Pages deploy hook every weekday evening (after US
# markets close and FRED posts the day's series) so Pages runs a fresh build —
# re-fetching FRED via the prebuild data script and regenerating the OG images.
# Monthly series (unemployment, CPI) are picked up by the same daily run. The
# FRED key lives in Cloudflare Pages build env; this workflow only needs the
# deploy-hook URL.
on:
  schedule:
    # 23:30 UTC Mon–Fri: after the US close (21:00 UTC) and FRED's daily update.
    - cron: "30 23 * * 1-5"
  workflow_dispatch: {}

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages rebuild
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"
          echo "Triggered Cloudflare Pages rebuild."
